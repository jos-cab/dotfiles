##############################
### WINDOWS AND WORKSPACES ###
##############################

# Hyprland 0.55+ documents Lua window rules. This config still uses the
# deprecated hyprlang syntax; see the 0.54 docs for this format.
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = match:class kitty, float on

# Ignore maximize requests from apps. You'll probably like this.
# windowrule = match:class .*, suppress_event maximize

# Fix some dragging issues with XWayland
# windowrule = match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen_state_internal 0, match:pin false, no_focus on

# GTK portal dialogs can include large transparent CSD margins under XWayland.
windowrule = match:class Xdg-desktop-portal-gtk, float on, center on, border_size 0
